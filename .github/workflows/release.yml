# Builds BUGS I for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, bugs-i-<target>.tar.gz, with the game
# as bugs-i (the Makefile's bugs is too general a name for a command),
# plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). For everyone else:
# .deb, .rpm, .apk and Arch packages of the static Linux binary, made by
# nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v1.3-av.1: the 1991 version, then our release. Linux
# builds run in Alpine and link ncurses statically; macOS links the system
# ncurses. No Windows: the game uses POSIX signals, getuid and mkdir.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: bugs-i
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            make CURSES_CFLAGS= CURSES_LIBS="-lncurses -ltinfo" LDFLAGS="-static -s" CFLAGS=-O2 bugs &&
            make CURSES_CFLAGS= CURSES_LIBS="-lncurses -ltinfo" LDFLAGS=-static CFLAGS=-O2 test'
          sudo chown -R "$(id -u):$(id -g)" .
          file bugs

      - name: Package for av
        run: |
          # the binary at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp bugs stage/$ID
          cp README README.rst README.linux PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          make CURSES_CFLAGS= CURSES_LIBS=-lncurses CFLAGS="-O2 -arch ${{ matrix.arch }}" \
            LDFLAGS="-arch ${{ matrix.arch }}" bugs
          strip bugs
          file bugs

      - name: Package
        run: |
          mkdir -p stage dist
          cp bugs stage/$ID
          cp README README.rst README.linux PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "BUGS I $TAG" \
                 --notes "BUGS I ${TAG%%-av.*}, Scott Noecker's 1991 curses game, restored and brought to today's terminals for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
