# System packages (.deb, .rpm, .apk, Arch) for BUGS I, built by nfpm from
# the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our release) and ARCH (amd64 or arm64), and leaves the
# binary at ./bugs; it is installed as bugs-i.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: bugs-i
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none           # 1.3, not 1.3.0
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/bugs-i
license: Public Domain
description: |
  Clear the board of bugs, a 1991 curses puzzle game.
  Two-letter pieces fall onto a board full of bugs; line up four of a
  letter with a bug among them and it is gone. Clear every bug to reach
  the next level. Scott Noecker's game, restored and brought to today's
  terminals by Asciiverse.
contents:
  - src: bugs
    dst: /usr/bin/bugs-i
    file_info: { mode: 0755 }
  - src: README
    dst: /usr/share/doc/bugs-i/README
    file_info: { mode: 0644 }
  - src: README.rst
    dst: /usr/share/doc/bugs-i/README.rst
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/bugs-i/PATCHES.md
    file_info: { mode: 0644 }
